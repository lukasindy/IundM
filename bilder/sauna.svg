    <path d="M-24 -56 h48 l-20 56 20 56 h-48 l20 -56z" fill="#F3EBDD" opacity=".85"/><path d="M-12 -30 h24 l-12 28z M-18 54 h36 l-18 -22z" fill="#E9B44C"/></g>
