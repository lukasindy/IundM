  <rect x="0" y="366" width="640" height="26" fill="#E2BF91"/><rect x="0" y="392" width="640" height="108" fill="#A87C55"/>
  <g stroke="#9A6E48" stroke-width="2"><path d="M0 283h560M0 379h640"/></g>
